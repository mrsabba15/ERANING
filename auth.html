<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f1ef" />
    <title>Your Coco &amp; Co. account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="auth.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <a class="auth-back" href="/">‹ <span>Back to shop</span></a>
      <header class="auth-hero">
        <a class="auth-brand" href="/">COCO <i>&amp; CO.</i></a>
        <p class="auth-eyebrow">A LITTLE MORE COCOA</p>
        <h1 id="auth-title">Your Coco &amp; Co. account</h1>
        <p>Sign in to see your chocolate orders and saved picks.</p>
      </header>
      <section class="auth-card" aria-labelledby="auth-title">
        <div class="auth-tabs" role="tablist" aria-label="Account access">
          <button
            class="active"
            type="button"
            data-auth-mode="login"
            role="tab"
            aria-selected="true"
          >
            Sign in
          </button>
          <button
            type="button"
            data-auth-mode="register"
            role="tab"
            aria-selected="false"
          >
            Create account
          </button>
        </div>
        <form id="auth-form">
          <label for="auth-email">Email or phone number</label>
          <input
            id="auth-email"
            name="identifier"
            type="text"
            inputmode="text"
            autocomplete="username"
            maxlength="254"
            placeholder="you@example.com or +91 98765 43210"
            required
          />
          <label for="auth-password">Password</label>
          <input
            id="auth-password"
            name="password"
            type="password"
            autocomplete="current-password"
            minlength="8"
            maxlength="200"
            placeholder="At least 8 characters"
            required
          />
          <p class="auth-hint" id="auth-hint">
            Use your account email and password.
          </p>
          <p
            class="auth-error"
            id="auth-error"
            role="status"
            aria-live="polite"
          ></p>
          <button class="auth-submit" type="submit" id="auth-submit">
            Sign in <span>→</span>
          </button>
        </form>
        <p class="auth-security-note">
          No OTP needed. Your password is securely hashed and never stored as
          readable text.
        </p>
      </section>
      <p class="auth-footer">Small-batch chocolate for the good bits.</p>
    </main>
  </body>
</html>
